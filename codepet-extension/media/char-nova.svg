<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 240">
  <!-- Shadow -->
  <ellipse cx="62" cy="225" rx="38" ry="7" fill="#412402" opacity="0.10"/>

  <!-- Legs -->
  <rect x="36" y="170" width="20" height="34" rx="3" fill="#854F0B"/>
  <rect x="62" y="170" width="20" height="34" rx="3" fill="#854F0B"/>
  <!-- Boots -->
  <rect x="29" y="196" width="30" height="14" rx="5" fill="#633806"/>
  <rect x="59" y="196" width="30" height="14" rx="5" fill="#633806"/>

  <!-- Tail (big chunky fox tail) -->
  <path d="M102,182 Q130,157 128,192 Q126,217 112,212" fill="none" stroke="#BA7517" stroke-width="14" stroke-linecap="round"/>

  <!-- Body -->
  <rect x="22" y="97" width="80" height="78" rx="6" fill="#BA7517"/>
  <!-- White chest patch -->
  <rect x="38" y="103" width="48" height="50" rx="4" fill="#FAEEDA" opacity="0.5"/>
  <!-- Star badge on chest -->
  <rect x="50" y="118" width="24" height="20" rx="3" fill="#EF9F27" opacity="0.7"/>
  <rect x="56" y="122" width="12" height="3" rx="1" fill="#FCDE5A" opacity="0.9"/>
  <rect x="58" y="128" width="8" height="3" rx="1" fill="#FCDE5A" opacity="0.7"/>

  <!-- Arms -->
  <rect x="2" y="106" width="22" height="16" rx="5" fill="#BA7517"/>
  <rect x="0" y="118" width="16" height="14" rx="5" fill="#EF9F27"/>
  <rect x="100" y="106" width="22" height="16" rx="5" fill="#BA7517"/>
  <rect x="108" y="112" width="18" height="14" rx="5" fill="#EF9F27"/>
  <!-- Right hand claw -->
  <rect x="120" y="100" width="8" height="14" rx="3" fill="#EF9F27"/>

  <!-- Pointed triangular ears -->
  <polygon points="28,44 14,10 48,36" fill="#BA7517"/>
  <polygon points="32,42 20,13 46,36" fill="#EF9F27"/>
  <polygon points="96,44 110,10 76,36" fill="#BA7517"/>
  <polygon points="92,42 104,13 78,36" fill="#EF9F27"/>

  <!-- Head -->
  <rect x="18" y="36" width="88" height="66" rx="10" fill="#BA7517"/>
  <!-- Muzzle -->
  <rect x="36" y="72" width="52" height="22" rx="8" fill="#FAEEDA" opacity="0.7"/>

  <!-- Eyes — white base -->
  <rect x="26" y="48" width="26" height="20" rx="4" fill="white" opacity="0.95"/>
  <rect x="72" y="48" width="26" height="20" rx="4" fill="white" opacity="0.95"/>
  <!-- Irises (looking up-right = curiosity) -->
  <rect x="27" y="48" width="24" height="9" rx="2" fill="#412402"/>
  <rect x="73" y="48" width="24" height="9" rx="2" fill="#412402"/>
  <rect x="30" y="50" width="18" height="15" fill="#412402"/>
  <rect x="76" y="50" width="18" height="15" fill="#412402"/>
  <!-- Eye shine -->
  <rect x="32" y="52" width="6" height="5" rx="1" fill="white" opacity="0.9"/>
  <rect x="78" y="52" width="6" height="5" rx="1" fill="white" opacity="0.9"/>
  <!-- Star sparkle in eyes -->
  <rect x="42" y="52" width="4" height="4" rx="1" fill="#FCDE5A" opacity="0.8"/>
  <rect x="88" y="52" width="4" height="4" rx="1" fill="#FCDE5A" opacity="0.8"/>

  <!-- Nose -->
  <rect x="52" y="76" width="20" height="10" rx="4" fill="#633806" opacity="0.8"/>

  <!-- Mouth (smile) -->
  <path d="M42 88 Q62 96 82 88" fill="none" stroke="#633806" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating star sparkle -->
  <rect x="6" y="16" width="8" height="8" rx="2" fill="#FCDE5A" opacity="0.5"/>
</svg>
