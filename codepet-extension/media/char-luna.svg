<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 240">
  <!-- Shadow -->
  <ellipse cx="62" cy="225" rx="38" ry="7" fill="#26215C" opacity="0.10"/>

  <!-- Legs -->
  <rect x="36" y="168" width="20" height="38" rx="3" fill="#3C3489"/>
  <rect x="62" y="168" width="20" height="38" rx="3" fill="#3C3489"/>
  <!-- Shoes -->
  <rect x="28" y="196" width="32" height="14" rx="4" fill="#26215C"/>
  <rect x="60" y="196" width="32" height="14" rx="4" fill="#26215C"/>

  <!-- Phone (held in right hand) -->
  <rect x="108" y="118" width="14" height="18" rx="3" fill="#FAEEDA"/>
  <rect x="110" y="118" width="12" height="20" rx="3" fill="#2C2C2A"/>
  <rect x="112" y="120" width="8" height="14" rx="2" fill="#7F77DD" opacity="0.7"/>

  <!-- Body (purple jacket) -->
  <rect x="22" y="97" width="80" height="76" rx="6" fill="#534AB7"/>
  <!-- Jacket zip line -->
  <rect x="59" y="97" width="6" height="76" fill="#3C3489" opacity="0.5"/>
  <!-- Zip pull detail -->
  <rect x="34" y="110" width="8" height="8" rx="2" fill="#7F77DD" opacity="0.5"/>
  <rect x="34" y="122" width="8" height="3" rx="1" fill="#AFA9EC" opacity="0.4"/>
  <!-- Jacket pocket -->
  <rect x="38" y="142" width="48" height="22" rx="4" fill="#3C3489" opacity="0.6"/>
  <rect x="62" y="142" width="2" height="22" fill="#26215C" opacity="0.4"/>

  <!-- Arms -->
  <rect x="2" y="106" width="22" height="16" rx="5" fill="#534AB7"/>
  <rect x="0" y="118" width="16" height="14" rx="4" fill="#FAEEDA"/>
  <rect x="100" y="106" width="22" height="16" rx="5" fill="#534AB7"/>

  <!-- Head (human, skin-toned) -->
  <rect x="16" y="34" width="92" height="68" rx="12" fill="#FAEEDA"/>

  <!-- Dark hair -->
  <path d="M16,58 Q14,34 30,22 Q46,10 62,10 Q78,10 94,22 Q110,34 108,58 Q100,42 62,38 Q24,42 16,58Z" fill="#2C2C2A"/>
  <!-- Side hair -->
  <rect x="16" y="56" width="10" height="40" rx="4" fill="#2C2C2A"/>
  <rect x="18" y="90" width="8" height="10" rx="4" fill="#2C2C2A" opacity="0.7"/>
  <rect x="22" y="42" width="8" height="30" rx="3" fill="#2C2C2A"/>

  <!-- Headphone arc -->
  <path d="M16,58 Q16,34 62,32 Q108,34 108,58" fill="none" stroke="#534AB7" stroke-width="5" stroke-linecap="round"/>
  <!-- Headphone pads -->
  <rect x="10" y="54" width="12" height="18" rx="5" fill="#534AB7"/>
  <rect x="102" y="54" width="12" height="18" rx="5" fill="#534AB7"/>

  <!-- Eyes — white bases -->
  <rect x="34" y="56" width="22" height="18" rx="4" fill="white" opacity="0.95"/>
  <rect x="68" y="56" width="22" height="18" rx="4" fill="white" opacity="0.95"/>
  <!-- Irises -->
  <rect x="35" y="56" width="20" height="8" rx="2" fill="#3C3489"/>
  <rect x="69" y="56" width="20" height="8" rx="2" fill="#3C3489"/>
  <rect x="38" y="58" width="14" height="12" fill="#3C3489"/>
  <rect x="72" y="58" width="14" height="12" fill="#3C3489"/>
  <!-- Eye shine -->
  <rect x="40" y="60" width="5" height="4" rx="1" fill="white" opacity="0.9"/>
  <rect x="74" y="60" width="5" height="4" rx="1" fill="white" opacity="0.9"/>
  <!-- Star detail in eyes -->
  <rect x="48" y="60" width="4" height="4" rx="1" fill="#7F77DD" opacity="0.6"/>
  <rect x="82" y="60" width="4" height="4" rx="1" fill="#7F77DD" opacity="0.6"/>

  <!-- Nose -->
  <rect x="54" y="78" width="16" height="8" rx="3" fill="#EF9F27" opacity="0.4"/>

  <!-- Mouth (gentle smile) -->
  <path d="M42 88 Q62 95 82 88" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Floating star sparkles -->
  <rect x="4" y="20" width="8" height="8" rx="2" fill="#7F77DD" opacity="0.35"/>
  <rect x="112" y="28" width="6" height="6" rx="1" fill="#AFA9EC" opacity="0.4"/>
</svg>
