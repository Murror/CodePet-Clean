<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 240">
  <!-- Shadow -->
  <ellipse cx="62" cy="225" rx="38" ry="7" fill="#04342C" opacity="0.10"/>

  <!-- Legs -->
  <rect x="40" y="170" width="18" height="34" rx="3" fill="#085041"/>
  <rect x="64" y="170" width="18" height="34" rx="3" fill="#085041"/>
  <!-- Feet -->
  <rect x="32" y="196" width="28" height="12" rx="4" fill="#04342C"/>
  <rect x="62" y="196" width="28" height="12" rx="4" fill="#04342C"/>

  <!-- Body (feather-striped) -->
  <rect x="22" y="97" width="80" height="78" rx="6" fill="#1D9E75"/>
  <!-- Feather stripes -->
  <rect x="22" y="106" width="80" height="2" fill="#085041" opacity="0.3"/>
  <rect x="22" y="114" width="80" height="2" fill="#085041" opacity="0.3"/>
  <rect x="22" y="122" width="80" height="2" fill="#085041" opacity="0.3"/>
  <rect x="22" y="130" width="80" height="2" fill="#085041" opacity="0.3"/>

  <!-- Slab wings -->
  <rect x="2" y="100" width="22" height="60" rx="6" fill="#0F6E56"/>
  <rect x="100" y="100" width="22" height="60" rx="6" fill="#0F6E56"/>
  <!-- Wing feather stripes -->
  <rect x="4" y="108" width="18" height="2" fill="#085041" opacity="0.4"/>
  <rect x="4" y="116" width="18" height="2" fill="#085041" opacity="0.4"/>
  <rect x="4" y="124" width="18" height="2" fill="#085041" opacity="0.4"/>

  <!-- Scroll (held by right wing) -->
  <rect x="96" y="120" width="26" height="36" rx="4" fill="#FAEEDA"/>
  <rect x="100" y="126" width="16" height="2" rx="1" fill="#BA7517" opacity="0.5"/>
  <rect x="100" y="131" width="16" height="2" rx="1" fill="#BA7517" opacity="0.5"/>
  <rect x="100" y="136" width="11" height="2" rx="1" fill="#BA7517" opacity="0.4"/>

  <!-- Neck stub -->
  <rect x="52" y="92" width="20" height="12" rx="4" fill="#1D9E75"/>

  <!-- Head (wide round) -->
  <rect x="14" y="30" width="96" height="72" rx="14" fill="#1D9E75"/>
  <!-- Belly feather highlight -->
  <ellipse cx="62" cy="64" rx="36" ry="30" fill="#9FE1CB" opacity="0.35"/>

  <!-- Dark brow tufts -->
  <rect x="26" y="32" width="18" height="8" rx="3" fill="#085041"/>
  <rect x="80" y="32" width="18" height="8" rx="3" fill="#085041"/>

  <!-- Enormous eyes — white bases -->
  <rect x="26" y="44" width="28" height="24" rx="6" fill="white" opacity="0.95"/>
  <rect x="70" y="44" width="28" height="24" rx="6" fill="white" opacity="0.95"/>
  <!-- Irises + pupils -->
  <rect x="27" y="44" width="26" height="10" rx="4" fill="#085041"/>
  <rect x="30" y="48" width="20" height="18" rx="4" fill="#085041"/>
  <rect x="33" y="50" width="7" height="6" rx="2" fill="white" opacity="0.9"/>
  <rect x="71" y="44" width="26" height="10" rx="4" fill="#085041"/>
  <rect x="74" y="48" width="20" height="18" rx="4" fill="#085041"/>
  <rect x="77" y="50" width="7" height="6" rx="2" fill="white" opacity="0.9"/>

  <!-- Triangle beak -->
  <polygon points="55,74 62,86 69,74" fill="#EF9F27"/>
</svg>
