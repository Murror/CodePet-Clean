<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 240">
  <!-- Shadow -->
  <ellipse cx="62" cy="225" rx="42" ry="8" fill="#501313" opacity="0.10"/>

  <!-- Legs (thick bear legs) -->
  <rect x="32" y="168" width="24" height="38" rx="4" fill="#A32D2D"/>
  <rect x="62" y="168" width="24" height="38" rx="4" fill="#A32D2D"/>
  <!-- Big boots -->
  <rect x="24" y="196" width="36" height="16" rx="5" fill="#791F1F"/>
  <rect x="58" y="196" width="36" height="16" rx="5" fill="#791F1F"/>

  <!-- Fist arms (chunky) -->
  <rect x="-4" y="102" width="26" height="20" rx="6" fill="#E24B4A"/>
  <rect x="-8" y="118" width="22" height="18" rx="6" fill="#F09595" opacity="0.7"/>
  <rect x="102" y="102" width="26" height="20" rx="6" fill="#E24B4A"/>
  <rect x="108" y="118" width="22" height="18" rx="6" fill="#F09595" opacity="0.7"/>

  <!-- Body (widest character) -->
  <rect x="18" y="95" width="88" height="80" rx="8" fill="#E24B4A"/>
  <!-- Belly area -->
  <rect x="32" y="110" width="60" height="44" rx="4" fill="#A32D2D" opacity="0.4"/>
  <!-- Engineer badge on chest -->
  <rect x="40" y="118" width="44" height="28" rx="4" fill="#A32D2D"/>
  <rect x="46" y="123" width="20" height="3" rx="1" fill="#F09595" opacity="0.7"/>
  <rect x="46" y="129" width="14" height="3" rx="1" fill="#F09595" opacity="0.5"/>
  <rect x="46" y="135" width="10" height="3" rx="1" fill="#F09595" opacity="0.4"/>

  <!-- Round bear ears -->
  <circle cx="24" cy="36" r="16" fill="#E24B4A"/>
  <circle cx="24" cy="36" r="10" fill="#F09595" opacity="0.6"/>
  <circle cx="100" cy="36" r="16" fill="#E24B4A"/>
  <circle cx="100" cy="36" r="10" fill="#F09595" opacity="0.6"/>

  <!-- Head (big wide) -->
  <rect x="12" y="36" width="100" height="66" rx="12" fill="#E24B4A"/>
  <!-- Muzzle patch -->
  <rect x="34" y="74" width="56" height="24" rx="8" fill="#F09595" opacity="0.45"/>

  <!-- Thick dark brows -->
  <rect x="22" y="46" width="28" height="8" rx="3" fill="#501313"/>
  <rect x="74" y="46" width="28" height="8" rx="3" fill="#501313"/>

  <!-- Eyes — white bases -->
  <rect x="24" y="54" width="26" height="20" rx="4" fill="white" opacity="0.95"/>
  <rect x="74" y="54" width="26" height="20" rx="4" fill="white" opacity="0.95"/>
  <!-- Irises -->
  <rect x="25" y="54" width="24" height="9" rx="2" fill="#501313"/>
  <rect x="75" y="54" width="24" height="9" rx="2" fill="#501313"/>
  <rect x="28" y="57" width="18" height="14" fill="#501313"/>
  <rect x="78" y="57" width="18" height="14" fill="#501313"/>
  <!-- Eye shine -->
  <rect x="30" y="59" width="6" height="5" rx="1" fill="white" opacity="0.9"/>
  <rect x="80" y="59" width="6" height="5" rx="1" fill="white" opacity="0.9"/>

  <!-- Nose/snout -->
  <rect x="50" y="80" width="24" height="12" rx="5" fill="#791F1F" opacity="0.8"/>

  <!-- Grin -->
  <path d="M38 94 Q62 103 86 94" fill="none" stroke="#791F1F" stroke-width="2.5" stroke-linecap="round"/>
</svg>
